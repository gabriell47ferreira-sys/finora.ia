name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK Environment
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Copy Assets to Android App
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          npx cap sync android --no-build || true

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_output.txt
        continue-on-error: true

      - name: Validate Gradle Build Output
        run: |
          if ! grep -q "BUILD SUCCESSFUL" gradle_output.txt; then
            tail -n 35 gradle_output.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Prepare APK for Distribution
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/finora-ai-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finora-ai-v1.0-apk
          path: release-apk/finora-ai-v1.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: FINORA AI v1.0.0 — Android APK
          body: |
            ## 📱 FINORA AI — Download do APK Oficial
            
            Baixe e instale o aplicativo Android oficial do **FINORA AI**:
            
            - ⚡ **Offline & Local-First**: Seus dados financeiros ficam seguros no seu aparelho.
            - 🤖 **Assistente com Inteligência Artificial**: Análise e consultoria financeira avançada.
            - 🎯 **Planejamento & Metas**: Controle de orçamento com base na regra 50/30/20.
            
            ### Como instalar:
            1. Baixe o arquivo **finora-ai-v1.0.apk** abaixo.
            2. Abra o arquivo baixado nas notificações ou no gerenciador de arquivos do celular.
            3. Se necessário, permita a instalação de apps de fontes desconhecidas no navegador.
            4. Conclua a instalação e abra o app!
          files: release-apk/finora-ai-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
